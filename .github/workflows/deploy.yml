name: Build and deploy to GitHub Pages

# One Pages site, two channels:
#   main    -> https://alessiogs.github.io/sailing-legends/      (published build)
#   develop -> https://alessiogs.github.io/sailing-legends/dev/  (test build)
# A Pages deploy replaces the whole site, so every deploy rebuilds both branches.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR runs never deploy, so they must not cancel a deploy in progress.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # Tests and type-checks the commit that triggered the run (push or PR).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Simulation tests
        run: npm test
      # Pull requests only type-check: the production bundle takes most of the run time and the type-check
      # is the part that catches errors. Pushes to main/develop still run the full build.
      - name: Type-check
        if: github.event_name == 'pull_request'
        run: npx tsc -b
      - name: Type-check and build
        if: github.event_name != 'pull_request'
        run: npm run build

  # Builds main at the site root and develop under /dev/.
  site:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main
      - name: Does develop exist?
        id: dev
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin develop >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out develop
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: develop
          path: develop
      - name: Build main
        working-directory: main
        run: npm install --no-audit --no-fund && npm run build
      - name: Build develop
        if: steps.dev.outputs.exists == 'true'
        working-directory: develop
        run: npm install --no-audit --no-fund && npm run build
      - name: Assemble site
        run: |
          mkdir site
          cp -r main/dist/. site/
          if [ -d develop/dist ]; then
            mkdir site/dev
            cp -r develop/dist/. site/dev/
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
